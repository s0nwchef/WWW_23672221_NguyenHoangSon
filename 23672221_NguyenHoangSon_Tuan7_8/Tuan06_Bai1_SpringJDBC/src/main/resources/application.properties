spring.application.name=employee-management
server.port=8080

# --- DataSource (MariaDB / XAMPP) - sửa username, password cho đúng máy của bạn ---
spring.datasource.url=jdbc:mariadb://localhost:3306/employeedb?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=sapassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.suffix=.html
spring.thymeleaf.prefix=classpath:/templates/

# --- Log câu SQL (bỏ comment nếu muốn xem) ---
#logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
#logging.level.org.springframework.data.jdbc=DEBUG
