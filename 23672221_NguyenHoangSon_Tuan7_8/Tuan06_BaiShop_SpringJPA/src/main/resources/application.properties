spring.application.name=shopping
server.port=8085

# --- DataSource (MariaDB / XAMPP) - sửa username, password cho đúng máy của bạn ---
spring.datasource.url=jdbc:mariadb://localhost:3306/shoppingdb?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sapassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- JPA / Hibernate ---
# none: import shopping.sql trước, Hibernate KHÔNG được tự tạo/sửa bảng
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.suffix=.html
spring.thymeleaf.prefix=classpath:/templates/
