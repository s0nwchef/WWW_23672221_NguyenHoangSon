<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Danh sách sản phẩm')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main><h1>Danh sách sản phẩm</h1><table class="data"><thead><tr><th>ID</th><th>Tên sản phẩm</th><th>Giá</th><th>Tồn kho</th></tr></thead><tbody><tr th:each="p : ${products}"><td th:text="${p.id}"></td><td><a th:href="@{/product/{id}(id=${p.id})}" th:text="${p.name}"></a></td><td class="num" th:text="${#numbers.formatDecimal(p.price, 1, 2)}"></td><td th:text="${p.inStock} ? 'Còn hàng' : 'Hết hàng'"></td></tr></tbody></table></main></body></html>
