<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chi tiết sản phẩm')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main><p><a th:href="@{/product}">← Danh sách sản phẩm</a></p><h1 th:text="${product.name}"></h1><dl class="card detail"><dt>ID</dt><dd th:text="${product.id}"></dd><dt>Giá</dt><dd th:text="${#numbers.formatDecimal(product.price, 1, 2)}"></dd><dt>Tồn kho</dt><dd th:text="${product.inStock} ? 'Còn hàng' : 'Hết hàng'"></dd></dl><h2>Phản hồi sản phẩm</h2><ul class="card"><li th:each="c : ${product.comments}" th:text="${c.text}"></li><li th:if="${#lists.isEmpty(product.comments)}">Chưa có phản hồi.</li></ul></main></body></html>
