<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Chi tiết hóa đơn')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main><p><a th:href="@{/order}">← Danh sách hóa đơn</a></p><h1>Hóa đơn #<span th:text="${order.id}"></span></h1><dl class="card detail"><dt>Ngày lập</dt><dd th:text="${order.orderDate}"></dd><dt>Khách hàng</dt><dd><a th:href="@{/customer/{id}(id=${order.customer.id})}" th:text="${order.customer.name}"></a></dd></dl><h2>Chi tiết hóa đơn</h2><table class="data"><thead><tr><th>Sản phẩm</th><th>Đơn giá</th><th>Số lượng</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="line : ${order.lines}"><td><a th:href="@{/product/{id}(id=${line.product.id})}" th:text="${line.product.name}"></a></td><td class="num" th:text="${#numbers.formatDecimal(line.purchasePrice, 1, 2)}"></td><td class="num" th:text="${line.amount}"></td><td class="num" th:text="${#numbers.formatDecimal(line.lineTotal, 1, 2)}"></td></tr><tr th:if="${#lists.isEmpty(order.lines)}"><td colspan="4" class="empty">Hóa đơn chưa có chi tiết.</td></tr></tbody></table></main></body></html>
