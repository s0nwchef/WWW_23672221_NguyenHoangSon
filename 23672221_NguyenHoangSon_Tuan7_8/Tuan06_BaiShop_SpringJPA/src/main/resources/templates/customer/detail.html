<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Hồ sơ khách hàng')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main><p><a th:href="@{/customer}">← Danh sách khách hàng</a></p><h1 th:text="${customer.name}"></h1><dl class="card detail"><dt>ID</dt><dd th:text="${customer.id}"></dd><dt>Khách từ ngày</dt><dd th:text="${customer.customerSince}"></dd></dl><h2>Lịch sử mua hàng</h2><table class="data"><thead><tr><th>Hóa đơn</th><th>Ngày lập</th></tr></thead><tbody><tr th:each="o : ${customer.orders}"><td><a th:href="@{/order/{id}(id=${o.id})}" th:text="${o.id}"></a></td><td th:text="${o.orderDate}"></td></tr><tr th:if="${#lists.isEmpty(customer.orders)}"><td colspan="2" class="empty">Khách hàng chưa có hóa đơn.</td></tr></tbody></table></main></body></html>
