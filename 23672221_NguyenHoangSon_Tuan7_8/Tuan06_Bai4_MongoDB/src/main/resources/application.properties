spring.application.name=employee-management
server.port=8080

# --- MongoDB (link kết nối + tên database nằm chung trong URI) ---
spring.data.mongodb.uri=mongodb://localhost:27017/employeewww

# true: nếu collection department / position còn trống thì tự nạp từ resources/data/*.json
app.seed-data=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.suffix=.html
spring.thymeleaf.prefix=classpath:/templates/

# --- Log câu lệnh Mongo (bỏ comment nếu muốn xem) ---
#logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
